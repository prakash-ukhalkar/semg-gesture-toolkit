[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "semg-gesture-toolkit"
version = "0.1.0"
description = "Open-source Python toolkit for subject-disjoint surface EMG gesture classification: multi-domain feature extraction, consensus feature selection, LOSO cross-validation, SHAP/permutation/ablation explainability cross-checking, and ONNX deployment benchmarking."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Bio-Mechanics sEMG Gesture Recognition Team" }
]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "pyarrow",
    "scikit-learn",
    "xgboost",
    "lightgbm",
    "catboost",
    "optuna",
    "shap",
    "PyWavelets",
    "matplotlib",
    "seaborn",
    "networkx",
    "joblib",
    "psutil",
    "PyYAML",
    "tqdm",
    "tabulate",
    "ipykernel",
    "jupyter",
    "pytest",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
